[package]
name = "buzzard"
version = "0.1.0"
edition = "2021"
description = "AUR helper that reviews every package with rules, the Jev decision model and a sandbox before installing it"
license = "MIT"
readme = "README.md"
repository = "https://github.com/YOUR_GITHUB_USER/buzzard"
keywords = ["arch-linux", "aur", "security", "pacman", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.80"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
